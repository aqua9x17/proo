{% extends "base.html" %}
{% block content %}
<h3>Company Settings</h3>
<div class="card mb-3"><div class="card-body">
<form method="post" enctype="multipart/form-data">{% csrf_token %}
  {{ form.as_p }}
  <button class="btn btn-primary">Save Settings</button>
</form>
</div></div>
<div class="card"><div class="card-body">
  <a class="btn btn-outline-primary" href="{% url 'core_settings:backup_database' %}">Download Backup</a>
  <hr>
  <form method="post" action="{% url 'core_settings:restore_database' %}" enctype="multipart/form-data">
    {% csrf_token %}
    <input type="file" name="backup_file" class="form-control mb-2" required>
    <button class="btn btn-outline-danger">Restore Database</button>
  </form>
</div></div>
{% endblock %}
