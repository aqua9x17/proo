{% extends "base.html" %}
{% block content %}
<h3>Users <a class="btn btn-sm btn-primary" href="{% url 'accounts:user_create' %}">Add</a></h3>
<table class="table table-striped"><tr><th>User</th><th>Role</th><th>Actions</th></tr>
{% for user_obj in object_list %}<tr><td>{{ user_obj.username }}</td><td>{{ user_obj.get_role_display }}</td><td><a href="{% url 'accounts:user_update' user_obj.pk %}">Edit</a> | <a href="{% url 'accounts:user_delete' user_obj.pk %}">Delete</a></td></tr>{% endfor %}
</table>
{% endblock %}
