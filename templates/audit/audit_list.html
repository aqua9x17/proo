{% extends "base.html" %}
{% block content %}
<h3>Audit Logs</h3>
<table class="table table-striped"><tr><th>Time</th><th>Actor</th><th>Action</th><th>Model</th><th>Details</th></tr>
{% for log in object_list %}<tr><td>{{ log.created_at }}</td><td>{{ log.actor }}</td><td>{{ log.action }}</td><td>{{ log.model_name }}</td><td>{{ log.details }}</td></tr>{% endfor %}
</table>
{% endblock %}
